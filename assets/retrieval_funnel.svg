<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#020617; border-radius:12px; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="funnelP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="funnelP2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="funnelP3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <marker id="fArrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="fArrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#818cf8"/>
    </marker>
    <marker id="fArrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Border -->
  <rect x="1" y="1" width="958" height="518" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Query Header -->
  <g transform="translate(30, 20)">
    <rect width="210" height="42" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="18" y="26" fill="#38bdf8" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700">QUERY q</text>
    <text x="96" y="26" fill="#94a3b8" font-size="11.5">User Prompt Turn</text>
    
    <path d="M 210 21 L 280 21" stroke="#38bdf8" stroke-width="2" marker-end="url(#fArrowCyan)"/>
  </g>

  <!-- Stage 1: Phase 1 Macro-Sweep -->
  <g transform="translate(290, 20)">
    <rect width="640" height="110" rx="8" fill="url(#funnelP1)" stroke="#0891b2" stroke-width="1.2"/>
    
    <rect x="16" y="14" width="200" height="20" rx="4" fill="#164e63" stroke="#22d3ee" stroke-width="0.8"/>
    <text x="24" y="28" fill="#67e8f9" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">PHASE 1: MACRO-SWEEP (d=64)</text>

    <rect x="520" y="14" width="105" height="20" rx="4" fill="#0e7490" fill-opacity="0.3"/>
    <text x="572" y="28" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-family="'JetBrains Mono', monospace">Latency &lt; 0.2ms</text>

    <text x="16" y="54" fill="#f8fafc" font-size="12.5" font-weight="700">Coarse Cluster Pruning via Matryoshka Prefix</text>
    <text x="16" y="74" fill="#a5f3fc" font-size="11" font-family="'JetBrains Mono', monospace">
      Score(C_k) = q[:64] • C_k[:64]
    </text>
    <text x="16" y="93" fill="#cbd5e1" font-size="11">
      Prunes 90%+ irrelevant topic manifolds; selects <tspan fill="#38bdf8" font-weight="700">Top-K Clusters (K=3)</tspan> without touching node arrays.
    </text>
  </g>

  <!-- Flow Down to Phase 2 -->
  <path d="M 610 130 L 610 162" stroke="#818cf8" stroke-width="2" marker-end="url(#fArrowIndigo)"/>

  <!-- Stage 2: Phase 2 Fine Episodic Re-Ranking -->
  <g transform="translate(290, 168)">
    <rect width="640" height="135" rx="8" fill="url(#funnelP2)" stroke="#6366f1" stroke-width="1.2"/>

    <rect x="16" y="14" width="250" height="20" rx="4" fill="#312e81" stroke="#818cf8" stroke-width="0.8"/>
    <text x="24" y="28" fill="#c7d2fe" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">PHASE 2: FINE EPISODIC RE-RANKING (d=1024)</text>

    <rect x="520" y="14" width="105" height="20" rx="4" fill="#4338ca" fill-opacity="0.3"/>
    <text x="572" y="28" text-anchor="middle" fill="#a5b4fc" font-size="9.5" font-family="'JetBrains Mono', monospace">Filtered Obsolete</text>

    <text x="16" y="54" fill="#f8fafc" font-size="12.5" font-weight="700">Composite Salience &amp; Temporal Distance Scoring</text>
    <text x="16" y="74" fill="#e0e7ff" font-size="11" font-family="'JetBrains Mono', monospace">
      Score(n_i) = cos(q, e_i) • T(Δt_i) + ω_surp • α_i
    </text>
    <text x="16" y="94" fill="#a5b4fc" font-size="10.5" font-family="'JetBrains Mono', monospace">
      where T(Δt_i) = λ_floor + (1 - λ_floor)·exp(-Δt_i / τ)
    </text>
    <text x="16" y="115" fill="#cbd5e1" font-size="11">
      Enforces <tspan fill="#f43f5e" font-weight="700">DAG Invalidation Masking</tspan> (<tspan font-family="'JetBrains Mono', monospace">WHERE status='ACTIVE'</tspan>). Returns <tspan fill="#818cf8" font-weight="700">Top-N Nodes (N=3)</tspan>.
    </text>
  </g>

  <!-- Flow Down to Phase 3 -->
  <path d="M 610 303 L 610 335" stroke="#10b981" stroke-width="2" marker-end="url(#fArrowEmerald)"/>

  <!-- Stage 3: Phase 3 Dynamic Verbatim Hydration Gate -->
  <g transform="translate(290, 340)">
    <rect width="640" height="155" rx="8" fill="url(#funnelP3)" stroke="#10b981" stroke-width="1.2"/>

    <rect x="16" y="14" width="240" height="20" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="0.8"/>
    <text x="24" y="28" fill="#6ee7b7" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">PHASE 3: VERBATIM HYDRATION GATE</text>

    <text x="16" y="52" fill="#f8fafc" font-size="12.5" font-weight="700">Decoupled Physical Storage vs. Episodic Abstraction</text>
    
    <!-- Split Branches Inside Phase 3 -->
    <g transform="translate(16, 62)">
      <!-- Branch A: Verbatim Hydration -->
      <rect width="295" height="78" rx="6" fill="#022c22" stroke="#059669" stroke-width="1"/>
      <text x="12" y="20" fill="#34d399" font-size="11" font-weight="700">IF Score ≥ H_thresh (0.85) OR Verbatim Query</text>
      <text x="12" y="38" fill="#a7f3d0" font-size="10.5">Hydrate from <tspan font-weight="700">Tier 1 SQLite WAL Vault</tspan>:</text>
      <rect x="10" y="46" width="275" height="24" rx="4" fill="#064e3b" fill-opacity="0.6"/>
      <text x="18" y="62" fill="#d1fae5" font-size="9.5" font-family="'JetBrains Mono', monospace">[Turn verbatim] Raw immutable text</text>
    </g>

    <g transform="translate(325, 62)">
      <!-- Branch B: Episodic Summary -->
      <rect width="295" height="78" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" fill="#94a3b8" font-size="11" font-weight="700">ELSE (Normal Recall / Abstract Query)</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="10.5">Inject <tspan font-weight="700">Tier 2 Episodic Summary</tspan>:</text>
      <rect x="10" y="46" width="275" height="24" rx="4" fill="#1e293b" fill-opacity="0.6"/>
      <text x="18" y="62" fill="#94a3b8" font-size="9.5" font-family="'JetBrains Mono', monospace">[Episodic Ref] Compressed context</text>
    </g>
  </g>

  <!-- Left Sidebar Summary Callouts -->
  <g transform="translate(30, 80)">
    <rect width="230" height="415" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
    
    <text x="16" y="28" fill="#f8fafc" font-size="12" font-weight="700">Why Multi-Stage?</text>
    
    <circle cx="22" cy="52" r="3" fill="#38bdf8"/>
    <text x="32" y="55" fill="#38bdf8" font-size="10.5" font-weight="700">1. Sub-millisecond Scale</text>
    <text x="32" y="70" fill="#94a3b8" font-size="10">Scanning 10,000 centroids</text>
    <text x="32" y="84" fill="#94a3b8" font-size="10">at d=64 takes &lt;0.5ms.</text>

    <circle cx="22" cy="112" r="3" fill="#818cf8"/>
    <text x="32" y="115" fill="#818cf8" font-size="10.5" font-weight="700">2. Zero Contradiction</text>
    <text x="32" y="130" fill="#94a3b8" font-size="10">Phase 2 consults NLI DAG</text>
    <text x="32" y="144" fill="#94a3b8" font-size="10">to mask superseded nodes.</text>

    <circle cx="22" cy="172" r="3" fill="#34d399"/>
    <text x="32" y="175" fill="#34d399" font-size="10.5" font-weight="700">3. ZSinvert Protection</text>
    <text x="32" y="190" fill="#94a3b8" font-size="10">Phase 3 pulls raw tokens</text>
    <text x="32" y="204" fill="#94a3b8" font-size="10">from SQLite, eliminating</text>
    <text x="32" y="218" fill="#94a3b8" font-size="10">inversion hallucinations.</text>

    <line x1="16" y1="240" x2="214" y2="240" stroke="#1e293b" stroke-width="1"/>

    <text x="16" y="264" fill="#e2e8f0" font-size="11" font-weight="700">Funnel Guarantee</text>
    <text x="16" y="284" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">Recall: 100% fine-res</text>
    <text x="16" y="302" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">Latency: O(K + N)</text>
    <text x="16" y="320" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">Fidelity: Exact literal</text>
  </g>
</svg>
